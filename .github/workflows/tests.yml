# Full WP Chrono test suite (dev-env/tests/autonomous-full-suite.sh) on
# GitHub's Linux runners: Apache-style dev stack (WordPress 6.7.2) and the
# production-like nginx + PHP-FPM + OPcache stack (WordPress 7.1.3), in
# parallel. Logs and screenshots are uploaded as artifacts.
#
# The repo keeps the test environment in dev-env/; the scripts expect it next
# to the plugin folder (../dev-env), so it is moved there first.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: dev
            compose: docker-compose.yml
            wp: wordpress.tar.gz
          - stack: prod
            compose: prod/docker-compose.yml
            wp: wordpress-7.1.3.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          path: wp-chrono

      - name: Lay out plugin + dev-env side by side
        run: mv wp-chrono/dev-env dev-env

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wp-chrono/package-lock.json

      - run: npm ci
        working-directory: wp-chrono

      - name: Cache downloads (WordPress, WooCommerce, WP-CLI, Plugin Check)
        uses: actions/cache@v4
        with:
          path: dev-env/cache
          key: dev-env-cache-v1

      - name: Download test packages
        working-directory: dev-env/cache
        run: |
          get() { [ -s "$1" ] || curl -fsSL --retry 3 -o "$1" "$2"; }
          get wordpress.tar.gz       https://wordpress.org/wordpress-6.7.2.tar.gz
          get wordpress-7.1.3.tar.gz https://wordpress.org/wordpress-7.1.3.tar.gz
          get woocommerce-9.9.7.zip  https://downloads.wordpress.org/plugin/woocommerce.9.9.7.zip
          get plugin-check.zip       https://downloads.wordpress.org/plugin/plugin-check.2.1.0.zip
          get wp-cli.phar            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          chmod +x wp-cli.phar
          ls -la

      - name: Build test images (see dev-env/README.md)
        run: |
          docker run --name wpc-build redis:7-alpine sh -c 'apk add --no-cache bash curl less mariadb mariadb-client \
            php83 php83-mysqli php83-pdo_mysql php83-mbstring php83-xml php83-curl php83-zip php83-gd php83-phar \
            php83-openssl php83-tokenizer php83-ctype php83-fileinfo php83-dom php83-simplexml php83-xmlreader \
            php83-xmlwriter php83-intl php83-iconv php83-session php83-exif php83-sodium php83-json php83-zlib php83-posix \
            && ln -sf /usr/bin/php83 /usr/bin/php'
          docker commit wpc-build wp-chrono-dev:latest && docker rm wpc-build
          docker run --name wpc-prod-build wp-chrono-dev:latest sh -c 'apk add --no-cache nginx php83-fpm php83-opcache su-exec'
          docker commit wpc-prod-build wp-chrono-prod:latest && docker rm wpc-prod-build
          docker run --name wpc-74 alpine:3.15 sh -c 'apk add --no-cache php7 php7-tokenizer && ln -sf /usr/bin/php7 /usr/bin/php'
          docker commit wpc-74 wp-chrono-php74:latest && docker rm wpc-74

      - name: Full suite
        working-directory: dev-env
        env:
          COMPOSE_FILE: ${{ matrix.compose }}
          WP_TARBALL: ${{ matrix.wp }}
          CHROME_PATH: /usr/bin/google-chrome
        run: bash tests/autonomous-full-suite.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.stack }}
          path: dev-env/tests/artifacts/
          retention-days: 14
