# All suites, split into three ~6-9 min groups that run in parallel.
#   pull requests to master/main, nightly (skipped when nothing was committed
#   in the last 24 h), manual dispatch, and release.yml (both stacks).
# Each group starts its own fresh stack; license-checks runs first in every
# group because later suites need the test Pro license it leaves active.
name: full

on:
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '17 2 * * *'   # 02:17 UTC
  workflow_dispatch:
    inputs:
      stacks:
        description: Which stack(s)
        type: choice
        options: [prod, dev, both]
        default: prod
  workflow_call:
    inputs:
      stacks:
        type: string
        default: both

concurrency:
  group: full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nightly-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE="$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          N="$(gh api "repos/${{ github.repository }}/commits?sha=${{ github.sha }}&since=$SINCE&per_page=1" --jq length)"
          echo "commits since $SINCE: $N"
          echo "changed=$([ "$N" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  suites:
    needs: nightly-gate
    if: ${{ !cancelled() && (needs.nightly-gate.result == 'skipped' || needs.nightly-gate.outputs.changed == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(inputs.stacks == 'both' && '["prod","dev"]' || format('["{0}"]', inputs.stacks || 'prod')) }}
        group: [updates, data, ui-release]
        include:
          # WordPress 6.7.2 here: core-update-checks needs an older site to run a
          # real upgrade to 7.1.3. quick.yml runs the same Safe Updates suites on 7.1.3.
          - group: updates
            wp: wordpress.tar.gz
            suites: ^(license-checks|upgrader-checks|rollback-checks|update-rollback-checks|safe-update-checks|safe-update-woo-checks|core-update-checks|scheduled-checks)
          - group: data
            suites: ^(license-checks|rest-checks|http-checks|snapshot-checks|stress-checks|safety-checks|multisite-checks|blueprint-checks|cloud-checks|contract-checks|import-checks|import-validation-checks|recovery-checks)
          - group: ui-release
            suites: ^(TypeScript typecheck|Production build|PHP 8\.3 lint|PHP 7\.4 lint|license-checks|ui-e2e-checks|CLI commands|release-checks|update-checks)
    uses: ./.github/workflows/suites.yml
    with:
      label: ${{ matrix.group }}
      suites: ${{ matrix.suites }}
      stack: ${{ matrix.stack }}
      wp: ${{ matrix.wp || '' }}
      timeout: 25
